<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="#f0f0f0" name="theme-color"/>
    <link href="/site.webmanifest" rel="manifest"/>
    <script>
      // Apply the saved theme before the app bundle or styles can paint.
      (() => {
        // Chromium crops macOS maskable icons; Safari scales them to fit.
        // Keep the same manifest id so existing installations retain identity.
        if (/Macintosh/.test(navigator.userAgent) && /(?:Chrome|Chromium|Edg)\//.test(navigator.userAgent)) {
          document.querySelector('link[rel="manifest"]').href = "/site-chromium-macos.webmanifest";
        }
        let theme = {};
        try {
          theme = JSON.parse(localStorage.getItem("theme")) || {};
        } catch {
          // Storage may be unavailable; follow the system preference instead.
        }
        const mode = ["light", "dark"].includes(theme.themeMode)
          ? theme.themeMode
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const selected = theme[`${mode}Theme`];
        const available = mode === "dark" ? ["dark", "nord-dark"] : ["light", "stone"];
        document.documentElement.classList.add(mode);
        document.documentElement.dataset.theme = available.includes(selected) ? selected : mode;
        const colors = { light: "#f0f0f0", dark: "#0a0a0a", stone: "#e3e0db", "nord-dark": "#242933" };
        document.querySelector('meta[name="theme-color"]').content = colors[document.documentElement.dataset.theme];
      })();
    </script>
    <style>
      /* Critical startup colors, before the main Tailwind stylesheet loads. */
      html {
        --startup-background: #f0f0f0;
        color-scheme: light;
        background-color: var(--sidebar, var(--startup-background));
      }
      html.dark {
        --startup-background: #0a0a0a;
        color-scheme: dark;
      }
      html[data-theme="stone"] { --startup-background: #e3e0db; }
      html[data-theme="nord-dark"] { --startup-background: #242933; }
      body { margin: 0; }
    </style>
    <link href="/favicon-96x96.png" rel="icon" sizes="96x96" type="image/png"/>
    <link href="/favicon.svg" rel="icon" sizes="any" type="image/svg+xml"/>
    <link href="/favicon.ico" rel="shortcut icon"/>
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/>
    <meta content="Nextflux" name="apple-mobile-web-app-title"/>
    <meta content="no-referrer" name="referrer"/>
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
    <meta content="yes" name="apple-mobile-web-app-capable"/>
    <meta content="yes" name="mobile-web-app-capable"/>
    <meta content="yes" name="apple-touch-fullscreen"/>
    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
          name="viewport"/>
    <meta content="A Simple but Powerful RSS Reader for Miniflux" name="description"/>
    <!-- Fonts are loaded on demand via fontLoader.js -->
    <title>Nextflux</title>
</head>
<body class="bg-sidebar">
  <div id="root"></div>

<script>
(() => {
  if (!new URLSearchParams(location.search).has("translation-trace")) return;

  const selectors = { heading: ".article-title", body: ".article-view-content .article-content.prose" };
  const previous = {};
  const events = [];
  const started = performance.now();
  let route = location.pathname;
  let translated;
  const output = document.createElement("textarea");
  output.readOnly = true;
  output.rows = 7;
  output.setAttribute("aria-label", "翻訳診断ログ");

  function record(message) {
    events.push(Math.round(performance.now() - started) + " ms | " + message);
    if (events.length > 150) events.shift();
    output.value = events.join("\n");
    output.scrollTop = output.scrollHeight;
  }

  function inspect(records) {
    if (route !== location.pathname) {
      route = location.pathname;
      record("navigation");
    }
    const root = document.documentElement;
    const isTranslated = root.matches(".translated-ltr, .translated-rtl");
    if (translated !== isTranslated) {
      translated = isTranslated;
      record("translation marker " + (translated ? "on" : "off"));
    }
    for (const [name, selector] of Object.entries(selectors)) {
      const node = document.querySelector(selector);
      const old = previous[name];
      const fonts = node?.querySelectorAll("font").length ?? 0;
      const changes = records.filter(({ target }) =>
        node?.contains(target) || old?.contains(target)
      ).length;
      if (old !== node) {
        previous[name] = node;
        record(name + (node ? " mounted" : " removed") + " | font " + fonts);
      }
      if (changes) record(name + " changes " + changes + " | font " + fonts);
    }
  }

  const observer = new MutationObserver(inspect);
  observer.observe(document.getElementById("root"), {
    subtree: true, childList: true, characterData: true,
  });
  observer.observe(document.documentElement, {
    attributes: true, attributeFilter: ["class", "lang"],
  });
  record("nextflux trace ready");
  inspect([]);

  const panel = document.createElement("details");
  panel.translate = false;
  panel.style.cssText =
    "position:fixed;bottom:8px;left:8px;z-index:2147483647;background:#202124;color:#fff;padding:8px;border:1px solid #aaa;border-radius:6px";
  const title = document.createElement("summary");
  title.textContent = "翻訳診断ログ";
  output.style.cssText = "display:block;width:min(440px,85vw);color:#111;background:#fff";
  panel.append(title, output);
  document.body.append(panel);
})();
</script>  <script src="/src/main.jsx" type="module"></script>
</body>
</html>
